<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pITstop</title>
<!-- Huisstijl SJSP Blankenberge: DM Sans (tekst) + Cal Sans (koppen) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== Huisstijl Sint-Jozef Sint-Pieter (SJSP) Blankenberge ===== */
    --bg:#f6f4f5;
    --card:#ffffff;
    --ink:#1b1620;
    --muted:#6f6670;
    --line:#ece4e8;
    --accent:#b80b4d;          /* SJSP-framboos */
    --accent-soft:#fce4ee;
    --done:#16a34a;            /* groen = afgevinkt (succes) */
    --done-soft:#e9f8ee;
    --font-display:"Cal Sans","DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(27,22,32,.05), 0 8px 24px rgba(27,22,32,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-sans);
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 64px}

  /* Header */
  header{margin-bottom:28px}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--font-display);font-weight:600;font-size:32px;margin:6px 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:15px}
  .brand{display:inline-flex;align-items:center;gap:12px}
  .brand-logo{
    width:46px;height:46px;border-radius:13px;flex:none;
    background:var(--accent);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);text-decoration:none;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .brand-logo svg{width:27px;height:27px;display:block;transition:transform .5s ease}
  .brand-logo:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(184,11,77,.28)}
  .brand-logo:hover svg{transform:rotate(90deg)}       /* wiel draait even mee */
  .brand-logo:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}

  /* Grid van tegels */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:16px;
  }
  .tile{
    position:relative;
    aspect-ratio:1/1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;   /* inhoud bovenaan verankeren */
    gap:18px;                     /* vaste ruimte icoon → tekst, zo start elke titel gelijk */
    cursor:pointer;
    text-align:left;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    font:inherit;color:inherit;
    min-width:0;               /* laat de tegel krimpen zodat 1fr niet opblaast */
    overflow-wrap:anywhere;    /* lange woorden breken netjes af */
  }
  .tile:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(20,30,60,.08),0 16px 40px rgba(20,30,60,.12);border-color:#cfd8ec}
  .tile:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
  .tile .ico{
    width:52px;height:52px;border-radius:14px;
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
  }
  .tile .ico svg{width:26px;height:26px;display:block}
  .tile h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 4px;letter-spacing:-.005em}
  .tile p{margin:0;font-size:13px;color:var(--muted)}
  .tile .count{
    position:absolute;top:16px;right:16px;
    font-size:12px;font-weight:600;color:var(--muted);
    background:var(--bg);border:1px solid var(--line);
    padding:3px 9px;border-radius:999px;
  }

  /* Detail weergave */
  .detail{display:none}
  .detail.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .detail-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .back{
    display:inline-flex;align-items:center;gap:7px;
    background:none;border:none;cursor:pointer;
    color:var(--accent);font:inherit;font-weight:600;font-size:15px;
    padding:6px 0;
  }
  .back:hover{text-decoration:underline}
  .print-btn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:9px 18px;cursor:pointer;font:inherit;font-weight:600;font-size:14px;
    box-shadow:var(--shadow);
  }
  .print-btn:hover{background:#2f5fd8}

  .detail-head{margin-bottom:20px}
  .detail-head h1{margin:6px 0 6px}
  .progress-row{display:flex;align-items:center;gap:12px;margin-top:10px}
  .bar{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--done);border-radius:999px;transition:width .25s ease}
  .prog-label{font-size:13px;color:var(--muted);font-weight:600;min-width:74px;text-align:right}

  /* Checklist */
  ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  li.section-head{
    list-style:none;margin:14px 0 2px;padding:0;
    font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--accent);display:flex;align-items:center;gap:10px;
  }
  li.section-head:first-child{margin-top:0}
  li.section-head span{white-space:nowrap}
  li.section-head::after{content:"";flex:1;height:1px;background:var(--line)}
  li.step{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;display:flex;gap:14px;align-items:flex-start;
    cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s ease, background .15s ease;
  }
  li.step:hover{border-color:#cfd8ec}
  li.step .num{
    flex:none;width:30px;height:30px;border-radius:50%;
    border:2px solid var(--line);color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;transition:all .15s ease;
  }
  li.step .body{flex:1;padding-top:2px}
  li.step .body-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  li.step .body strong{display:block;font-size:15px;margin-bottom:2px}
  li.step .body .note{display:block;font-size:13.5px;color:var(--muted)}
  li.step .body .step-link{
    display:inline-flex;align-items:center;gap:4px;margin-top:8px;
    font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;
    background:var(--accent-soft);border-radius:8px;padding:5px 10px;
  }
  li.step .body .step-link:hover{background:#dde8ff;text-decoration:underline}
  li.step.done{background:var(--done-soft);border-color:#bfe8cc}
  li.step.done .num{background:var(--done);border-color:var(--done);color:#fff}
  li.step.done .body strong{text-decoration:line-through;color:var(--muted)}

  /* Prijslijst */
  li.price-row{
    list-style:none;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;
    box-shadow:var(--shadow);
  }
  li.price-row .p-name strong{display:block;font-size:15px}
  li.price-row .p-name .note{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  li.price-row .p-amount{flex:none;font-weight:800;font-size:18px;color:var(--ink);white-space:nowrap}

  /* Info-kaartje bovenaan een detail (bv. openingsuren ICT) */
  .info-card{
    background:var(--accent-soft);border:1px solid #d6e2ff;border-radius:14px;
    padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start;
    font-size:14px;color:#1e3a8a;
  }
  .info-card .info-ico{font-size:20px;line-height:1}

  .foot{margin-top:24px;text-align:center}
  .reset{
    background:none;border:1px solid var(--line);border-radius:999px;
    padding:8px 18px;cursor:pointer;font:inherit;font-size:13px;color:var(--muted);
  }
  .reset:hover{border-color:#cfd8ec;color:var(--ink)}

  /* ===== Middengebied (tablet / klein venster): hou 3 tegels aan =====
     Zo klappen we niet te vroeg naar 2 grote tegels. */
  @media (min-width:521px) and (max-width:820px){
    .grid{grid-template-columns:repeat(3,1fr)}
  }

  /* ===== Smalle schermen: 2 tegels naast elkaar, compacter =====
     Staat bewust NA de basisregels zodat deze voorrang krijgen. */
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);gap:12px}
    /* Strak vierkant én overal exact even hoog: inhoud mag de tegel niet oprekken */
    .tile{border-radius:16px;padding:14px;overflow:hidden}
    /* Icoon blijft, maar compacter zodat de titel zichtbaar blijft */
    .tile .ico{width:38px;height:38px;border-radius:11px;font-size:20px}
    .tile .ico svg{width:21px;height:21px}
    .tile h2{font-size:14px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    /* Ondertitel op 1 regel, ingekort met … zodat alles in het vierkant past */
    .tile p{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  }

  /* ===== Print / PDF ===== */
  @media print{
    @page{margin:16mm}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .detail-topbar,.progress-row,.foot,.eyebrow{display:none !important}
    .detail-head{margin-bottom:14px;border-bottom:2px solid #000;padding-bottom:10px}
    #d-title{font-size:24px}
    .info-card{border:1px solid #999;background:#fff !important;color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    ol.steps{gap:6px}
    li.section-head{color:#000 !important;margin:12px 0 4px;break-after:avoid}
    li.section-head::after{background:#000}
    li.step{
      box-shadow:none;border:1px solid #999;border-radius:8px;
      padding:10px 12px;break-inside:avoid;background:#fff !important;
    }
    li.step.done{background:#fff !important;border-color:#999 !important}
    li.step .num{
      border:2px solid #000 !important;background:#fff !important;color:#000 !important;
      border-radius:4px;width:22px;height:22px;font-size:0;
    }
    li.step.done .num{background:#fff !important}
    li.step.done .body strong{text-decoration:none;color:#000}
    li.step .body strong{color:#000}
    li.step .body .note{color:#333}
    li.step{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    li.price-row{
      box-shadow:none;border:1px solid #999;border-radius:8px;
      padding:9px 12px;break-inside:avoid;background:#fff !important;
    }
    li.price-row .p-name strong{color:#000}
    li.price-row .p-name .note{color:#333}
    li.price-row .p-amount{color:#000}
  }
</style>
</head>

    </div>
  </section>

</div>

/* ---------- helpers: plan kan 'steps' (plat) of 'sections' (met delen) hebben ---------- */
function sectionsOf(p){
  if(p.sections) return p.sections;
  return [{title:null, steps:p.steps}];
}
function flatSteps(p){
  return sectionsOf(p).reduce((a,s)=>a.concat(s.steps),[]);
}

/* ---------- state (onthouden per tegel in deze sessie) ---------- */
const state = {};
let currentId = null;

function ensureState(p){
  if(!state[p.id]) state[p.id] = flatSteps(p).map(()=>false);
  return state[p.id];
}

/* =========================================================
   ICONEN — strakke lijn-iconen (stroke = accentkleur).

/* ---------- grid renderen ---------- */
function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  PLANS.forEach(p=>{
    let badge = "";
    if(p.type!=="prices"){
      const total = flatSteps(p).length;
      const done = ensureState(p).filter(Boolean).length;
      badge = `<span class="count">${done}/${total}</span>`;
    }
    const btn = document.createElement("button");
    btn.className = "tile";
    btn.onclick = ()=>showDetail(p.id);
    btn.innerHTML = `
      ${badge}
      <div class="ico">${ICONS[p.icon] || p.icon}</div>
      <div>
        <h2>${p.title}</h2>
        <p>${p.sub}</p>
      </div>`;
    grid.appendChild(btn);
  });
}

/* ---------- detail renderen ---------- */
function showDetail(id){
  currentId = id;
  const p = PLANS.find(x=>x.id===id);
  const isPrices = p.type==="prices";
  document.getElementById("d-title").textContent = p.title;
  document.getElementById("d-sub").textContent = p.sub;

  // Info-kaartje
  const info = document.getElementById("d-info");
  info.innerHTML = p.info
    ? `<div class="info-card"><span class="info-ico">ℹ️</span><span>${p.info}</span></div>`
    : "";

  document.querySelector(".progress-row").style.display = isPrices ? "none" : "";
  document.querySelector(".foot").style.display = isPrices ? "none" : "";

  if(isPrices){
    document.getElementById("d-eyebrow").textContent = "Prijslijst";
    renderPrices(p);
    document.getElementById("home").style.display = "none";
    document.getElementById("detail").classList.add("active");
    window.scrollTo({top:0});
    return;
  }

  ensureState(p);
  document.getElementById("d-eyebrow").textContent = "Stappenplan";

  const ol = document.getElementById("d-steps");
  ol.innerHTML = "";
  let gi = 0;
  sectionsOf(p).forEach(section=>{
    if(section.title){
      const h = document.createElement("li");
      h.className = "section-head";
      h.innerHTML = `<span>${section.title}</span>`;
      ol.appendChild(h);
    }
    section.steps.forEach((s,localI)=>{
      const idx = gi++;
      const li = document.createElement("li");
      li.className = "step" + (state[id][idx] ? " done":"");
      li.onclick = ()=>toggleStep(idx);
      li.innerHTML = `
        <div class="num">${state[id][idx] ? "✓" : (localI+1)}</div>
        <div class="body">
          <div class="body-top">
            <strong>${s.title}</strong>
          </div>
          ${s.note ? `<span class="note">${s.note}</span>`:""}
          ${s.link ? `<a class="step-link" href="${s.link.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${s.link.label} ↗</a>`:""}
        </div>`;
      ol.appendChild(li);
    });
  });

  updateProgress();
  document.getElementById("home").style.display = "none";
  document.getElementById("detail").classList.add("active");
  window.scrollTo({top:0});
}

/* ---------- prijslijst renderen ---------- */
function renderPrices(p){
  const ol = document.getElementById("d-steps");
  ol.innerHTML = "";
  (p.groups || []).forEach(g=>{
    if(g.title){
      const h = document.createElement("li");
      h.className = "section-head";
      h.innerHTML = `<span>${g.title}</span>`;
      ol.appendChild(h);
    }
    g.items.forEach(it=>{
      const li = document.createElement("li");
      li.className = "price-row";
      li.innerHTML = `
        <div class="p-name">
          <strong>${it.name}</strong>
          ${it.note ? `<span class="note">${it.note}</span>`:""}
        </div>
        <div class="p-amount">${it.price}</div>`;
      ol.appendChild(li);
    });
  });
}

function showHome(){
  document.getElementById("detail").classList.remove("active");
  document.getElementById("home").style.display = "";
  renderGrid();
  window.scrollTo({top:0});
}

function toggleStep(i){
  state[currentId][i] = !state[currentId][i];
  showDetail(currentId);
}

function updateProgress(){
  const arr = state[currentId];
  const done = arr.filter(Boolean).length;
  const pct = Math.round(done/arr.length*100);
  document.getElementById("d-bar").style.width = pct + "%";
  document.getElementById("d-prog").textContent = `${done}/${arr.length} klaar`;
}

function resetCurrent(){
  state[currentId] = state[currentId].map(()=>false);
  showDetail(currentId);
}

renderGrid();
</script>
